{% extends "calibration/base.html" %}
{% block title %}Audit log{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
  <h3 class="mb-0">Audit log</h3>
  <form class="d-flex gap-2" method="get"><input class="form-control form-control-sm" name="q" value="{{ q }}" placeholder="User, device, action…"><button class="btn btn-sm btn-dark">Search</button></form>
</div>
<div class="card"><div class="card-body">
  {% include "calibration/_audit_table.html" with entries=entries %}
  {% if entries|length == 500 %}<p class="small text-muted mt-2">Showing the latest 500 entries.</p>{% endif %}
</div></div>
{% endblock %}
