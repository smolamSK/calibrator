<div class="mb-3">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label|capfirst }}</label>
  <div class="input-group">
    {{ field }}
    <button type="button" class="btn btn-outline-primary" data-lookup-add="{% if field.name == 'manufacturer' %}manufacturer{% else %}model{% endif %}"
      title="Add new {% if field.name == 'manufacturer' %}manufacturer{% else %}model{% endif %}">+</button>
  </div>
  {% if field.name == "device_model" %}<div class="form-text">Shows models of the selected manufacturer.</div>{% endif %}
  {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
</div>
