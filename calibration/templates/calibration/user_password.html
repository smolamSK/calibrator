{% extends "calibration/base.html" %}
{% block title %}Set password{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 560px"><div class="card-body">
  <h4>Set password for {{ obj.username }}</h4>
  <form method="post">{% csrf_token %}
    {% include "calibration/_form.html" %}
    <button class="btn btn-primary">Set password</button>
    <a class="btn btn-outline-secondary" href="{% url 'user_list' %}">Cancel</a>
  </form>
</div></div>
{% endblock %}
