{% extends "calibration/base.html" %}
{% block title %}Field{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 720px"><div class="card-body">
  <h4>{% if field %}Edit field “{{ field.name }}”{% else %}New field{% endif %} <span class="text-muted fs-6">in {{ category }}</span></h4>
  <form method="post">{% csrf_token %}
    {% include "calibration/_form.html" %}
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-outline-secondary" href="{% url 'category_detail' category.pk %}">Cancel</a>
  </form>
</div></div>
{% endblock %}
