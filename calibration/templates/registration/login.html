{% extends "calibration/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card mx-auto mt-5" style="max-width: 420px"><div class="card-body p-4">
  <h3 class="mb-4 text-center">Calibrator</h3>
  {% if form.errors %}<div class="alert alert-danger">Wrong username or password.</div>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="mb-3"><label class="form-label" for="id_username">Username</label>
      <input class="form-control" name="username" id="id_username" autofocus autocomplete="username" required></div>
    <div class="mb-3"><label class="form-label" for="id_password">Password</label>
      <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100">Log in</button>
  </form>
  <p class="text-center mt-3 mb-0"><a class="small" href="{% url 'password_reset' %}">Forgot password?</a></p>
</div></div>
{% endblock %}
